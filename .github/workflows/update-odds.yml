name: Update Odds

on:
  schedule:
    # Every 10 minutes. GitHub may delay scheduled runs slightly under load.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch odds from OddsJam
        env:
          ODDSJAM_API_KEY: ${{ secrets.ODDSJAM_API_KEY }}
        run: bash .github/scripts/update_odds.sh

      - name: Commit updated bets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/bets.json
          if git diff --cached --quiet; then
            echo "No odds changes to commit."
          else
            git commit -m "Update tracked bet odds"
            git push
          fi
