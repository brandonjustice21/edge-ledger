name: List Sportsbooks (temporary)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List all OddsJam sportsbooks
        env:
          ODDSJAM_API_KEY: ${{ secrets.ODDSJAM_API_KEY }}
        run: bash .github/scripts/list_sportsbooks.sh
      - name: Commit sportsbook dump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_sportsbooks-dump.json
          git commit -m "Dump OddsJam sportsbook list"
          git push
